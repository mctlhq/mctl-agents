version: 1

profiles:
  cheap:
    model: claude-haiku-5-5
    model_env: CLAUDE_CHEAP_MODEL

  balanced:
    model: claude-sonnet-5-5
    model_env: CLAUDE_BALANCED_MODEL

tasks:
  service_agent: balanced
  # Both left `cheap` (Haiku) on 2026-10-01. review_findings_normalize is the
  # shepherd's reading of review comments into severity-tagged findings, and
  # the shepherd merges on that reading -- a P2 read as P3 is an unattended
  # merge. Haiku had already failed judgement work here twice (the reviewer's
  # low tier approving a diff with a real P2, gitops#1058; the incident
  # responder's guessed root causes). mentor_digest runs weekly, so the
  # stronger model costs next to nothing there. `cheap` stays defined for
  # purely mechanical tasks. The 2026-10-16 move to Haiku 5.5 changes only the
  # cheap default; routing any task to `cheap` needs a separate evaluation.
  mentor_digest: balanced
  review_findings_normalize: balanced
  # Scout (#797). The relevance pass is a title+summary yes/no; a miss only
  # drops an article from a digest, it never acts. Dry-run review before
  # unsuspending is the evaluation the note above asks for; set to balanced
  # to fall back without a code change.
  scout_relevance: cheap
  scout_scoring: balanced

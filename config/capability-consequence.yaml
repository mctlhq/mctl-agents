# Consequence classification for every advertised mcp__mctl__* tool
# (mctlhq/mctl-agents#242, ADR 017:
# docs/adr/017-capability-discovery-and-gateway-contract.md).
#
# Loaded by orchestrator.capability.load_consequence_table(). ALL tiers go
# through the policy checkpoint before dispatch (ADR 017 sec. 8, option B,
# dated owner decision 2026-09-26): capability_invoke submits every
# capability to the PolicyCheckpoint, read-only included, so a
# misclassification here can no longer bypass policy the way it could before
# that decision — it can only misreport what the model is TOLD about a
# capability's side effect (capability_search/describe's `consequence`
# field), and, for read-only vs. mutating/consequential specifically, which
# capabilities BUILTIN_POLICY's mctl-mcp-read rule allows outright vs. which
# it routes to mctl-mcp-default-approval. A tool name NOT listed here is NOT
# read-only by omission: the loader's classify_consequence() defaults any
# name absent from this file to `consequential`, the fail-safe tier, and
# that default is hard-coded in orchestrator/capability.py, not configurable
# from this file.
#
# The 105 names below are mctl-api's advertised tool set as checked into this
# repo at docs/diagrams/archify/facts.yaml (`mcp_tools`, generated by
# tools/diagram_facts.py from every NewTool("mctl_*") definition in the
# non-test Go files of mctl-api's internal/mcp/ — see that script for how the
# snapshot is refreshed). Keys are the bare mctl-api tool
# name; orchestrator.capability.classify_consequence() also accepts the
# SDK-visible mcp__<alias>__<tool> spelling and strips the prefix before
# lookup.
#
# Classification rule (design.md, conservative and reviewed):
#   read-only     — get/list/read/resolve/whoami/status/summary
#                    operations; no side effect. A tool outside those verbs
#                    is read-only only when mctl-api annotates it
#                    ReadOnlyHint(true) AND policy_checkpoint._READ_TOOLS
#                    names it (analyze/inspect/plan/erpact status, #888).
#                    Every read-only key must also be ALLOW under policy_checkpoint.BUILTIN_POLICY
#                    (tests/test_capability_gateway.py asserts it): the
#                    checkpoint runs for it too, but BUILTIN_POLICY's
#                    mctl-mcp-read rule allows it outright rather than
#                    routing it to mctl-mcp-default-approval.
#   mutating      — deploy/scale/save/create/provision/publish/enable/
#                    disable/sync/resume operations whose effect is
#                    reversible or narrowly scoped.
#   consequential — delete/retire/rollback/promote/approve/trigger/grant
#                    operations, or anything not confidently read-only or
#                    mutating (fail-safe default, applied automatically to
#                    any unlisted name).
tools:
  mctl_abandon_dev_loop: consequential
  mctl_acknowledge_incident: mutating
  mctl_add_custom_domain: mutating
  mctl_approve_dev_loop: consequential
  # Creates a support task and spends the tenant's model budget: a paid
  # run like the triggers, so gated the same way.
  mctl_ask_support: consequential
  mctl_bind_agent_release: consequential
  # Direct human platform administrator only; changes a prepared customer
  # deletion's fence. Not confidently narrow, so the fail-safe tier.
  mctl_cancel_customer_deletion: consequential
  mctl_create_agent: mutating
  mctl_create_preview: mutating
  mctl_create_tenant: mutating
  # An approve/reject decision that reserves a funded workspace slot.
  mctl_decide_signup_request: consequential
  mctl_delete_preview: consequential
  mctl_delete_tenant: consequential
  # ReadOnlyHint(true) in mctl-api: a static analysis of a pinned commit.
  # Named in policy_checkpoint._READ_TOOLS so BUILTIN_POLICY allows it like
  # any other read (owner decision on #888, 2026-10-30).
  mctl_deploy_analyze: read-only
  mctl_deploy_service: mutating
  mctl_deprecate_platform_skill: consequential
  mctl_disable_tenant_skill: mutating
  mctl_enable_tenant_skill: mutating
  mctl_erpact_create_site: mutating
  # ReadOnlyHint(true); named in policy_checkpoint._READ_TOOLS (#888).
  mctl_erpact_list_sites: read-only
  # ReadOnlyHint(true); named in policy_checkpoint._READ_TOOLS (#888).
  mctl_erpact_site_status: read-only
  mctl_fence_lifecycle_claim: consequential
  mctl_get_agent: read-only
  mctl_get_agent_preflight: read-only
  mctl_get_commerce_budget: read-only
  mctl_get_commerce_receipt: read-only
  mctl_get_dev_loop: read-only
  mctl_get_epic_status: read-only
  mctl_get_incident: read-only
  mctl_get_lifecycle_ownership: read-only
  mctl_get_operation: read-only
  mctl_get_ready_work_items: read-only
  mctl_get_repo_binding: read-only
  mctl_get_resource_usage: read-only
  mctl_get_service_config: read-only
  mctl_get_service_logs: read-only
  mctl_get_service_pods: read-only
  mctl_get_service_status: read-only
  mctl_get_support_task: read-only
  mctl_get_tenant: read-only
  mctl_get_usage_summary: read-only
  mctl_get_work_item: read-only
  mctl_get_workflow_logs: read-only
  mctl_get_workflow_status: read-only
  mctl_grant_repo_access: consequential
  mctl_incident_summary: read-only
  # ReadOnlyHint(true): read-only evidence for a recovery decision; named in
  # policy_checkpoint._READ_TOOLS (#888).
  mctl_inspect_lifecycle_conflict: read-only
  mctl_list_agent_assets: read-only
  mctl_list_agent_executions: read-only
  mctl_list_agent_versions: read-only
  mctl_list_agents: read-only
  mctl_list_commerce_invocations: read-only
  mctl_list_domains: read-only
  mctl_list_incidents: read-only
  mctl_list_namespace_events: read-only
  mctl_list_operations: read-only
  mctl_list_platform_skills: read-only
  mctl_list_previews: read-only
  mctl_list_recent_agent_runs: read-only
  mctl_list_recent_operations: read-only
  mctl_list_repos: read-only
  mctl_list_services: read-only
  mctl_list_signup_requests: read-only
  mctl_list_tenant_skill_bindings: read-only
  mctl_list_tenants: read-only
  mctl_list_work_item_execution_requests: read-only
  mctl_list_work_item_executions: read-only
  mctl_list_work_item_snapshots: read-only
  mctl_list_workflows: read-only
  # ReadOnlyHint(true): plans a wave without starting anything (starting is
  # mctl_start_epic_wave); named in policy_checkpoint._READ_TOOLS (#888).
  mctl_plan_epic_wave: read-only
  mctl_promote_agent: consequential
  mctl_provision_database: mutating
  mctl_publish_agent_definition_version: mutating
  mctl_publish_agent_profile_version: mutating
  mctl_publish_agent_version: mutating
  mctl_publish_platform_skill: mutating
  mctl_read_platform_skill: read-only
  mctl_remove_custom_domain: consequential
  mctl_request_lifecycle_handoff: consequential
  # Appends one reconcile-requested event; changes no ownership column.
  mctl_request_lifecycle_reconcile: mutating
  # Records a request the execution platform then runs: starts work.
  mctl_request_work_item_execution: consequential
  mctl_resolve_agent: read-only
  mctl_resolve_incident: mutating
  mctl_retire_service: consequential
  # Re-arms the clocks of a handoff already stalled for the same target.
  mctl_retry_lifecycle_handoff: mutating
  mctl_rollback_agent: consequential
  mctl_rollback_agent_binding: consequential
  mctl_rollback_service: consequential
  mctl_scale_service: mutating
  mctl_set_agent_version_lifecycle: consequential
  # DestructiveHint(true) in mctl-api despite the name: it also sets slots.
  mctl_signup_capacity: consequential
  # Starts one DevLoopWorkflow per selected work item. Admin-only.
  mctl_start_epic_wave: consequential
  mctl_sync_repos: mutating
  mctl_trigger_agents_run: consequential
  mctl_trigger_approve: consequential
  mctl_trigger_implementer: consequential
  mctl_trigger_incident_responder: consequential
  mctl_trigger_issue: consequential
  mctl_trigger_mentor_only: consequential
  mctl_trigger_portal_server_auth_apply: consequential
  mctl_trigger_reconcile: consequential
  mctl_trigger_shepherd: consequential
  mctl_trigger_single_service: consequential
  # Starts a domain verification (a state change), and BUILTIN_POLICY gates
  # it under mctl-mcp-default-approval; read-only here would let the gateway
  # dispatch it unchecked (claude P1 on #508).
  mctl_verify_domain: mutating
  mctl_whoami: read-only

# Agent inventory — phase 0 of the dev-workflow control plane.
#
# Purpose: draw the line between things that are AGENTS (get an AgentManifest,
# an immutable version and a per-environment release in the registry) and
# things that merely orchestrate or support them. Everything here describes
# what exists TODAY; it is a classification, not a proposal.
#
# The distinguishing test for "agent": it calls the Claude Agent SDK, so its
# behaviour depends on a prompt and a model and can therefore regress between
# versions. A module that only globs files, queries GitHub and branches on the
# result is deterministic — it is orchestration, and belongs in a workflow.
#
# Consumed by orchestrator/validate_manifest.py (phase 1) to assert that every
# agent listed here has a manifest and vice versa.

version: 1

# ---------------------------------------------------------------------------
# Agents — one AgentManifest each.
# ---------------------------------------------------------------------------
#
# `promptSources` is the full set of inputs that determine behaviour. It is
# deliberately a LIST, not a single path: no agent in this system has its
# prompt in one file. Every agent composes
#   (a) an inline Python template, and
#   (b) zero or more on-disk files picked up from cwd by the SDK
#       (CLAUDE.md, .claude/agents/*.md sub-agents, .claude/skills/).
# The version hash in the registry must cover all of them, otherwise editing a
# sub-agent markdown file silently changes behaviour without a version bump.
#
# `promptSources` entries may be globs. Where a glob spans services (the
# implementer and service-agent cases), a change to ANY matched file bumps the
# single agent's version — these are per-service specialisations of one agent,
# not separate agents.

agents:
  - name: issue-investigator
    driver: orchestrator/run_issue_investigator.py
    entrypoint: orchestrator.run_issue_investigator:investigate
    optionsBuilder: orchestrator.options:build_issue_investigator_options
    promptSources:
      - inline: orchestrator/run_issue_investigator.py:_build_prompt
    modelPolicyTask: service_agent
    budgetEnv: ISSUE_INVESTIGATOR_BUDGET_USD   # default 3.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-investigate
    writes: gitops agents-state proposals + a GitHub issue comment
    riskLevel: low          # read-only against the target repo
    triggeredBy:
      - mctl_trigger_issue (MCP, admin-only)
      - orchestrator/run_issue_poller.py (agents:intake label)
    notes: >-
      cwd is a throwaway shallow clone of the target repo, so the SDK picks up
      no mctl-agents-owned prompt files at all — the inline template is the
      entire prompt surface. Simplest agent to version first, which is why it
      is the phase-4 pilot.

  - name: implementer
    driver: orchestrator/run_implementer.py
    entrypoint: orchestrator.run_implementer:implement_one
    optionsBuilder: orchestrator.options:build_implementer_agent_options
    promptSources:
      - inline: orchestrator/run_implementer.py:_build_prompt
      - glob: agents/*/.claude/agents/implementer.md
      - file: agents/_generic/.claude/agents/implementer.md   # fallback
    modelPolicyTask: service_agent
    budgetEnv: IMPLEMENTER_BUDGET_USD          # default 3.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-implement
    writes: commits + branch + PR on mctlhq/<service>
    riskLevel: high         # the only agent that authors code
    triggeredBy:
      - cronworkflow-mctl-agents-implement (currently suspend: true)
      - mctl_trigger_implementer (MCP, admin-only)
      - forked by run_shepherd.py with --review-feedback
    notes: >-
      Per-service sub-agent prompts are copied into the cloned repo's
      .claude/agents/ before launch (_copy_implementer_subagent), falling back
      to _generic. One agent with per-service specialisations — NOT eight
      agents: they share a driver, an options builder and a budget.

  - name: shepherd
    driver: orchestrator/run_shepherd.py
    entrypoint: orchestrator.run_shepherd:process_one
    optionsBuilder: orchestrator.options:build_shepherd_options
    promptSources:
      - inline: orchestrator/run_shepherd.py (findings-bundle prompt)
      - file: agents/_shepherd/.claude/agents/shepherd.md
    modelPolicyTask: review_findings_normalize
    budgetEnv: SHEPHERD_BUDGET_USD             # default 5.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-shepherd
    writes: PR merges, follow-up commits (via the implementer), status projections
    riskLevel: high         # it merges to main
    triggeredBy:
      - cronworkflow-mctl-agents-shepherd
      - mctl_trigger_shepherd (MCP, admin-only)
    notes: >-
      Mostly deterministic: decide() is a pure function and the SDK is used
      only to normalise review findings into a JSON bundle. When this moves to
      Temporal, decide() and the GitHub polling belong in the worker; only the
      normalisation call needs a sandboxed run. Runs with mcp_servers={} — it
      is the one agent with no mctl MCP access at all.

  - name: incident-responder
    driver: orchestrator/run_incident_responder.py
    entrypoint: orchestrator.run_incident_responder:run_incident_responder
    optionsBuilder: orchestrator.options:build_incident_responder_options
    promptSources:
      - inline: orchestrator/run_incident_responder.py:_build_prompt
      - file: agents/_incident-responder/CLAUDE.md
    modelPolicyTask: service_agent             # INCIDENT_RESPONDER_MODEL override
    budgetEnv: INCIDENT_RESPONDER_BUDGET_USD   # default 5.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-run
    writes: gitops proposals (status=accepted) + resolves mctl incidents
    riskLevel: medium       # writes accepted proposals, bypassing human triage
    triggeredBy:
      - cronworkflow-mctl-agents-incidents
      - mctl_trigger_incident_responder (MCP, admin-only)

  - name: service-agent
    driver: orchestrator/run_service_agent.py
    entrypoint: orchestrator.run_service_agent:run_service_agent
    optionsBuilder: orchestrator.options:build_service_agent_options
    promptSources:
      - glob: agents/*/CLAUDE.md
      # Listed one per line on purpose: promptSources globs are consumed by
      # Python's glob module, which does NOT expand brace syntax. A
      # `{researcher,analyst,spec-writer}.md` pattern silently matches nothing.
      # `agents/*/.claude/agents/*.md` would be shorter but would also swallow
      # implementer.md, which belongs to the implementer agent, not this one.
      - glob: agents/*/.claude/agents/researcher.md
      - glob: agents/*/.claude/agents/analyst.md
      - glob: agents/*/.claude/agents/spec-writer.md
      - glob: agents/*/.claude/skills/**
    modelPolicyTask: service_agent
    budgetEnv: SERVICE_AGENT_BUDGET_USD        # default 5.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-run
    writes: gitops inbox/ findings + proposals (status=proposed)
    riskLevel: low
    triggeredBy:
      - cwft-mctl-agents-daily
      - mctl_trigger_single_service / mctl_trigger_agents_run (MCP)
    notes: >-
      Runs the researcher/analyst/spec-writer rotation over ROTATING_SERVICES
      (config/settings.py). Prompt surface is entirely on-disk and per-service.
      Only mctl-docs additionally gets sibling-repo read access via add_dirs.

  - name: mentor
    driver: orchestrator/run_mentor.py
    entrypoint: orchestrator.run_mentor:run_mentor
    optionsBuilder: orchestrator.options:build_mentor_options
    promptSources:
      - inline: orchestrator/run_mentor.py:build_prompt
      - file: agents/_mentor/CLAUDE.md
    modelPolicyTask: mentor_digest
    budgetEnv: MENTOR_BUDGET_USD               # default 2.00
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-daily
    writes: agents/_mentor/digest/<week>.md
    riskLevel: low
    triggeredBy:
      - cwft-mctl-agents-daily (after the service-agent rotation)

# ---------------------------------------------------------------------------
# Orchestration — NOT agents. No manifest, no version, no release.
# ---------------------------------------------------------------------------
# These make zero Claude SDK calls. They are deterministic control flow that
# happens to be packaged as Python modules or Argo templates today, and they
# are exactly what the Temporal control plane replaces.

orchestration:
  - name: issue-poller
    path: orchestrator/run_issue_poller.py
    what: >-
      Scans open mctlhq issues carrying the agents:intake label and calls
      investigate() in-process for each, capped by --max-issues.
    becomes: Temporal Schedule starting one DevLoopWorkflow per labelled issue.

  - name: shepherd-reconcile
    path: orchestrator/run_shepherd.py --reconcile
    what: >-
      GitHub-first repair of .status.yaml drift. Exists only because there is
      no durable state — it re-derives the lifecycle from GitHub every run.
    becomes: >-
      Temporal Schedule that adopts orphan .status.yaml entries into workflows.
      Kept as a migration path and safety net, not deleted.

  - name: run_all
    path: orchestrator/run_all.py
    what: Fan-out over SERVICES for the rotation plus the mentor.
    becomes: Workflow fan-out (child workflows), or stays as-is for local runs.

  - name: cluster-workflow-templates
    path: mctl-gitops/platform-gitops/argo-workflows/cluster-templates/
    what: >-
      cwft-mctl-agents-{investigate,implement,shepherd,run,daily,reconcile,
      issue-poll}. Clone, run one driver, commit back to gitops main under the
      mctl-gitops-main-writes mutex, notify Telegram on exit.
    becomes: >-
      Stays. These remain the sandboxed execution backend invoked from Temporal
      activities; phase 3 makes their agent image a workflow parameter so the
      registry can pin it.

  - name: cronworkflows
    path: mctl-gitops/platform-gitops/argo-workflows/cluster-templates/cronworkflow-*.yaml
    what: >-
      Five schedules (issue-poll, implement [suspended], shepherd, incidents,
      reconcile), each concurrencyPolicy Forbid on a shared gitops mutex.
    becomes: Temporal Schedules, or deleted where the step folds into a workflow.

# ---------------------------------------------------------------------------
# Supporting registries — already exist, do NOT duplicate.
# ---------------------------------------------------------------------------

skills:
  sourceOfTruth: mctl-gitops/platform-gitops/platform-skills/catalog/
  what: >-
    One directory per skill (SKILL.md + metadata.yaml). Validated in CI by
    scripts/validate-platform-skills.py, served over MCP by
    mctl_list_platform_skills / mctl_read_platform_skill with visibility
    enforced server-side.
  note: >-
    This is already a versioned, validated catalog with a publish workflow. The
    agent registry references skills; it must not re-implement them.

tools:
  sourceOfTruth: https://api.mctl.ai/mcp
  what: mcp__mctl__* tools, scoped server-side by caller identity.
  note: >-
    Tool ALLOWANCE is declared per agent (options.py allowed_tools, surfaced in
    the manifest's toolPolicy); tool AUTHORIZATION stays server-side. The
    manifest is documentation and a lint target, never the enforcement point.

# ---------------------------------------------------------------------------
# Out of scope for the registry (for now) — see plan phase L3.
# ---------------------------------------------------------------------------

external:
  - name: mctl-agent
    repo: mctlhq/mctl-agent
    what: >-
      Separate Go service. AlertManager -> SQLite tickets -> 9 builtin Go
      skills + Claude API -> fix PRs against mctl-gitops. Its own store and its
      own loop; shares no code with this repo.
    note: >-
      Not an agent in this registry today. Integrates later by starting a
      Temporal workflow instead of a local ticket, at which point its builtin
      skills become a runtime type rather than a separate system.

[project]
name = "mctl-agents"
# Placeholder, and deliberately not the real version. release-please runs with
# release-type "simple", which maintains .release-please-manifest.json and the
# changelog but does not rewrite version strings in source files. A realistic
# value here would silently rot one release after it was written; the manifest
# is the single source of truth.
version = "0.0.0"
description = "Agent orchestrator for the mctl platform"
requires-python = ">=3.12,<3.13"

# Exact pins — the SDK loop IS the harness of this system; an unpinned harness
# means every image rebuild may silently change agent behavior. Bump
# deliberately, in an explicit commit (see issue #44).
#
# These four are the direct dependencies. Everything they pull in is pinned by
# uv.lock, which is what actually makes a rebuild reproducible: pinning only
# this list left ~40 transitive packages (pydantic, mcp, httpx, jsonschema,
# cryptography, starlette, ...) free to move between builds.
#
# Note that the harness includes a Claude Code CLI binary bundled inside the
# claude-agent-sdk wheel, so the pin below also fixes the CLI version.
dependencies = [
    "claude-agent-sdk==0.2.110",
    "anyio==4.14.1",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
]

[tool.uv]
# Not an installable package: there is no importable top-level distribution to
# build, and the image runs `python -m orchestrator.run_all` against the source
# tree it copies in. Without this, uv tries to build a wheel and fails.
package = false

[dependency-groups]
# `dev` is a default group: `uv sync` installs it unless told otherwise, which
# is why the image runs `uv sync --frozen --no-dev`.
dev = [
    "pytest~=9.0",
    "ruff~=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Deliberately excludes S (bandit): the codebase shells out to git/gh via
# subprocess.run() extensively (orchestrator/run_shepherd.py's _run() helper
# alone is used across the file), always with a list[str] command and never
# shell=True, so S603/S607 would be mostly noise against a real injection
# risk. Reconsider separately if that changes.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except — several call sites deliberately catch
              # bare Exception as a last-resort fallback (surface a result
              # instead of crashing the whole run) and justify it with a
              # `# noqa: BLE001`; this rule has to be enabled for RUF100 to
              # recognize those as used rather than flagging them as stale
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async — the whole orchestrator runs on AnyIO
    "RUF",    # ruff-specific rules, including RUF100 (unused noqa)
]

[tool.ruff.lint.per-file-ignores]
# These two files are almost entirely a natural-language prompt string fed
# to the Claude Agent SDK (PROMPT = """...""" / f"""..."""). Reflowing the
# lines to fit 120 chars would change the exact text the model sees, and a
# `#` on an interior line of a triple-quoted string isn't a Python comment —
# it becomes literal prompt content, so a per-line noqa isn't an option here.
"orchestrator/run_service_agent.py" = ["E501"]
"orchestrator/run_incident_responder.py" = ["E501"]

[project]
name = "mctl-agents"
# Placeholder, and deliberately not the real version. release-please runs with
# release-type "simple", which maintains .release-please-manifest.json and the
# changelog but does not rewrite version strings in source files. A realistic
# value here would silently rot one release after it was written; the manifest
# is the single source of truth.
version = "0.0.0"
description = "Agent orchestrator for the mctl platform"
requires-python = ">=3.12,<3.13"

# Exact pins — the SDK loop IS the harness of this system; an unpinned harness
# means every image rebuild may silently change agent behavior. Bump
# deliberately, in an explicit commit (see issue #44).
#
# These are the direct dependencies. Everything they pull in is pinned by
# uv.lock, which is what actually makes a rebuild reproducible: pinning only
# this list left ~40 transitive packages (pydantic, mcp, jsonschema,
# cryptography, starlette, ...) free to move between builds.
#
# Note that the harness includes a Claude Code CLI binary bundled inside the
# claude-agent-sdk wheel, so the pin below also fixes the CLI version.
#
# temporalio: orchestrator/temporal/ — the dev-workflow control plane worker
# (plan phase 4). httpx: promoted from a transitive dep (already pulled in by
# claude-agent-sdk/mcp) to a direct, deliberately-pinned one because
# orchestrator/temporal/activities/* now import it directly to call mctl-api.
dependencies = [
    "claude-agent-sdk==0.2.148",
    "anyio==4.14.2",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "temporalio==1.31.0",
    "httpx==0.28.1",
]

[tool.uv]
# Not an installable package: there is no importable top-level distribution to
# build, and the image runs `python -m orchestrator.run_all` against the source
# tree it copies in. Without this, uv tries to build a wheel and fails.
package = false

[dependency-groups]
# `dev` is a default group: `uv sync` installs it unless told otherwise, which
# is why the image runs `uv sync --frozen --no-dev`.
dev = [
    "pytest~=9.0",
    "ruff~=0.16",
    "mypy~=2.3",
    "types-pyyaml~=6.0",  # stub package — PyYAML ships no inline types
]

[tool.pytest.ini_options]
# Only this repo's tests. CI now checks mctl-gitops out into ./_gitops for
# the cross-repo catalog checks (mctl-agents#277), and a bare `pytest` was
# happily collecting THAT repo's test suite too — which fails at import,
# because its tests read paths relative to their own repo root. Collection
# aborted before a single test of ours ran.
#
# testpaths only applies when no path argument is given, so `pytest
# tests/test_manifest.py` and `pytest _gitops/...` still work as before.
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except — several call sites deliberately catch
              # bare Exception as a last-resort fallback (surface a result
              # instead of crashing the whole run) and justify it with a
              # `# noqa: BLE001`; this rule has to be enabled for RUF100 to
              # recognize those as used rather than flagging them as stale
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async — the whole orchestrator runs on AnyIO
    "RUF",    # ruff-specific rules, including RUF100 (unused noqa)
    "S",      # flake8-bandit — see per-file-ignores below for the two
              # categories that turned out to be noise rather than signal
              # once actually measured, not assumed
]

[tool.ruff.lint.per-file-ignores]
# These two files are almost entirely a natural-language prompt string fed
# to the Claude Agent SDK (PROMPT = """...""" / f"""..."""). Reflowing the
# lines to fit 120 chars would change the exact text the model sees, and a
# `#` on an interior line of a triple-quoted string isn't a Python comment —
# it becomes literal prompt content, so a per-line noqa isn't an option here.
"orchestrator/run_service_agent.py" = ["E501"]
"orchestrator/run_incident_responder.py" = ["E501"]

# S (bandit): measured before deciding, not assumed. A bare `--select S`
# reported 432 findings; 424 of them (98.1%) are entirely inside tests/ and
# confirmed false positives on inspection — S101 (411, plain pytest
# `assert`, the standard pattern), S105 (5, fake tokens like "seed-token" in
# monkeypatch fixtures for orchestrator/github_token.py's refresh logic),
# S108 (2, `Path("/tmp") / slug` building a test fixture's proposal_dir),
# S603+S607 (6, tests/test_run_implementer_chart_guard.py's
# subprocess.run(["git", ...], cwd=tmp_path, check=True) calls that spin up
# a real, throwaway git repo as a test fixture — genuinely executed, not
# mocked, but every command is a fixed literal with no untrusted input).
# Ignoring the same three categories mctl-trading-data's ruff.toml already
# ignores in tests/, for the same "fine in tests" reasoning, plus S108.
"tests/*" = ["S101", "S105", "S108", "S603", "S607"]

# The remaining 8 S603 findings split as: 3 inside tests/ (the git-fixture
# calls above, covered by the ignore two lines up) and 5 in production code,
# which are NOT ignored here at all — each of the 5 call sites
# (run_implementer.py, run_issue_investigator.py, run_shepherd.py x3)
# carries its own `# noqa: S603` at the call site instead of a per-file
# ignore, so a subprocess call added to any of these files in the future is
# still checked rather than silently exempted by file scope.

[tool.mypy]
python_version = "3.12"
# Matches what CI/local `mypy` (no args) checks — the same dirs ruff and
# pytest cover. `tools/` is in: publish_agent_release.py runs unattended on
# every release with a token that can write the agent registry, so it is the
# last place that should be exempt from the checks (claude P2 on #238). `tests/` is deliberately out for now: fixtures and mocks lean
# hard on duck typing (see tests/conftest.py's FakeMcpClient), so bringing it
# under the same bar is a separate, bigger pass, not part of onboarding mypy
# for the first time.
files = ["orchestrator", "config", "tools"]

# Soft mode: this is the first mypy pass over a previously-unchecked 5,800+
# line codebase. Deliberately NOT enabling disallow_untyped_defs/strict here —
# that's a real ratcheting decision (would demand annotating every def) for a
# separate change, not something to fold into "add the tool for the first
# time." These two are pure hygiene: they catch a genuinely stale
# `# type: ignore` or cast rather than restricting what's allowed today.
warn_unused_ignores = true
warn_redundant_casts = true

# `files` above deliberately excludes tests/, but mypy still FOLLOWS imports
# into it: tools/record_workflow_history.py imports tests.replay_scenarios,
# which imports the workflow test modules for their fake activities (#251 —
# sharing one definition between the recorder and the replay tests is what
# stops the recorded histories drifting from what the tests exercise).
#
# Without this, adding that one import re-imports every duck-typed fixture in
# tests/ into the checked set and fails CI on pre-existing code the config
# says is out of scope. Errors are silenced rather than the import ignored,
# so tools/ still type-checks against the real signatures.
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

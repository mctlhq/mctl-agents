name: Context7 Reindex

on:
  push:
    branches: [main]

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 Reindex
        run: |
          REPO_NAME="${{ github.repository }}"
          echo "Triggering Context7 reindex for ${REPO_NAME}..."
          curl -s -X POST "https://context7.com/api/v2/add/repo/github" \
            -H "Content-Type: application/json" \
            -d "{\"repoUrl\": \"https://github.${REPO_NAME}\"}" || true

name: diag app-token identity

# Temporary, read-only diagnostic. Manual trigger only. Determines which
# GitHub App backs the org-wide APP_ID/APP_PRIVATE_KEY secrets referenced by
# release-please.yml, and whether it has enough scope on this repo to be
# usable as release-please-action's `token:` input — without touching
# release-please.yml itself, which has broken releases org-wide twice before
# (see project memory) and cannot be safely dry-run (its own workflow only
# fires on `push: branches: [main]`).
#
# Only prints installation-id and app-slug, both explicitly documented by
# actions/create-github-app-token as non-sensitive. Never touches the
# `token` output. To be deleted once the answer is known, either way.
#
# Requests the exact permissions release-please-action's `token:` input
# would need (contents/pull-requests/issues: write) via permission-* inputs
# rather than the App's default grant. This makes the probe fail fast if the
# App is installed but under-scoped, instead of a false "success" that only
# proves installation, not usability (Codex review finding on PR #99).

on:
  workflow_dispatch:

permissions: {}

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate app token scoped to this repo
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-agents
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Report identity (non-sensitive outputs only)
        env:
          INSTALLATION_ID: ${{ steps.app.outputs.installation-id }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          echo "installation-id: ${INSTALLATION_ID}"
          echo "app-slug: ${APP_SLUG}"

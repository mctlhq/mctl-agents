name: rea-spike-796 (operator-run live benchmark)
# Spike-only, manual-only. Runs the merged harness tools/rea_spike.py live
# against the source-owned fixtures of #796 and uploads a bounded evidence
# bundle. Writes nothing to the repository, issues or PRs. Results reach main
# only through a separate reviewed change. Deleted when #796 closes.
on:
  workflow_dispatch:
    inputs:
      rea_ref:
        description: "morluto/rea branch, tag or commit to benchmark (resolved and recorded as a full SHA)"
        required: true
        type: string
      model:
        description: "Claude model id"
        required: false
        default: claude-opus-5-5
        type: string
      probe_arm:
        description: "Arm used for the five-stage probes"
        required: false
        default: rea-mcp
        type: choice
        options:
          - rea-mcp
          - rea-cli
permissions: {}
concurrency:
  group: rea-spike-796
  cancel-in-progress: false
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read investigator model pin (mctl-gitops)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          repository: mctlhq/mctl-gitops
          path: _gitops
          sparse-checkout: |
            argo-workflows/cluster-templates
            platform-gitops/argo-workflows/cluster-templates
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      # Node for the REA npm package. Version follows morluto/rea .nvmrc.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - name: Prepare bundle and install harness dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/rea-spike-796"
          echo "BUNDLE=$RUNNER_TEMP/rea-spike-796" >> "$GITHUB_ENV"
          echo "rea_ok=false" >> "$GITHUB_ENV"
          echo "infra_failed=0" >> "$GITHUB_ENV"
          uv sync --locked

      - name: Resolve and install REA
        # Install method and entrypoints come from upstream morluto/rea:
        # package.json (name rea-agents, bin "rea" -> scripts/rea.mjs) and
        # docs/installation.md (manual MCP registration: `rea-agents mcp`,
        # i.e. `rea mcp`). The npm package of the version found at the
        # pinned SHA is installed into an isolated prefix; the SHA is
        # checked out to read that version and is recorded, but the npm
        # artifact is not built from it (recorded as install_method).
        env:
          REA_REF: ${{ inputs.rea_ref }}
        run: |
          set -u
          REPO=https://github.com/morluto/rea
          SHA=""; VERSION=unobserved; REASON=""
          if printf '%s' "$REA_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            SHA="$REA_REF"
          else
            SHA=$(git ls-remote -- "$REPO" "$REA_REF" "refs/heads/$REA_REF" "refs/tags/$REA_REF" 2>/dev/null | awk 'NR==1{print $1}')
          fi
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            REASON="rea_ref-unresolved"; SHA=""
          fi
          if [ -z "$REASON" ]; then
            git init -q "$RUNNER_TEMP/rea" \
              && git -C "$RUNNER_TEMP/rea" fetch -q --depth 1 "$REPO" "$SHA" \
              && git -C "$RUNNER_TEMP/rea" checkout -q "$SHA" \
              && [ "$(git -C "$RUNNER_TEMP/rea" rev-parse HEAD)" = "$SHA" ] \
              || REASON="rea-checkout-failed"
          fi
          if [ -z "$REASON" ]; then
            VERSION=$(node -p "require('$RUNNER_TEMP/rea/package.json').version" 2>/dev/null || echo "")
            [ -n "$VERSION" ] || { REASON="rea-version-unreadable"; VERSION=unobserved; }
          fi
          GITHEAD=""; INTEGRITY=""
          INSTALL="npm install --ignore-scripts --prefix \$RUNNER_TEMP/rea-prefix rea-agents@$VERSION"
          if [ -z "$REASON" ]; then
            npm install --ignore-scripts --prefix "$RUNNER_TEMP/rea-prefix" "rea-agents@$VERSION" >"$RUNNER_TEMP/rea-install.log" 2>&1 \
              && "$RUNNER_TEMP/rea-prefix/node_modules/.bin/rea" --help >/dev/null 2>&1 \
              || REASON="rea-install-failed"
          fi
          PROVCOMMIT=""
          if [ -z "$REASON" ]; then
            # Bind the installed npm artifact to the resolved SHA. rea-agents is
            # published by GitHub Actions through npm OIDC, which records no
            # gitHead (6.8.0: absent) but attaches SLSA provenance naming the
            # source commit. The binding is: registry signatures and provenance
            # verify (`npm audit signatures`), the installed tarball has the
            # registry's dist.integrity, and the provenance for that tarball
            # names exactly the resolved SHA. Any unreadable step fails closed.
            GITHEAD=$(npm view "rea-agents@$VERSION" gitHead 2>/dev/null || echo "")
            INTEGRITY=$(npm view "rea-agents@$VERSION" dist.integrity 2>/dev/null || echo "")
            LOCKED=$(python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1]))["packages"]["node_modules/rea-agents"]["integrity"])' \
              "$RUNNER_TEMP/rea-prefix/package-lock.json" 2>/dev/null || echo "")
            if [ -z "$INTEGRITY" ] || [ "$LOCKED" != "$INTEGRITY" ]; then
              REASON="rea-identity-mismatch"
            elif ! npm audit signatures --prefix "$RUNNER_TEMP/rea-prefix" >"$RUNNER_TEMP/rea-audit.log" 2>&1; then
              REASON="rea-signatures-unverified"
            elif ! curl -fsS "https://registry.npmjs.org/-/npm/v1/attestations/rea-agents@$VERSION" -o "$RUNNER_TEMP/rea-attestations.json"; then
              REASON="rea-provenance-unreadable"
            else
              PROVCOMMIT=$(uv run --locked python tools/rea_spike.py npm-provenance "$RUNNER_TEMP/rea-attestations.json" \
                --integrity "$INTEGRITY" --repo "$REPO" 2>>"$RUNNER_TEMP/rea-install.log" || echo "")
              if [ -z "$PROVCOMMIT" ] || [ "$PROVCOMMIT" != "$SHA" ]; then
                REASON="rea-identity-mismatch"
              fi
            fi
          fi
          if [ -z "$REASON" ]; then
            echo "rea_ok=true" >> "$GITHUB_ENV"
            mkdir -p "$RUNNER_TEMP/rea-bin"
            # Real CLI stays outside PATH; the model only sees this shim,
            # which runs REA with credentials stripped.
            printf '#!/bin/sh\nexec sh "%s/docs/spikes/796/rea-env.sh" "%s/rea-prefix/node_modules/.bin/rea" "$@"\n' \
              "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$RUNNER_TEMP/rea-bin/rea"
            chmod +x "$RUNNER_TEMP/rea-bin/rea"
          fi
          REA_SHA="$SHA" REA_VERSION="$VERSION" REA_REASON="$REASON" REA_INSTALL="$INSTALL" REA_GITHEAD="$GITHEAD" REA_INTEGRITY="$INTEGRITY" REA_PROVCOMMIT="$PROVCOMMIT" REPO="$REPO" \
            python3 -I - <<'PY' > "$BUNDLE/rea-metadata.json"
          import datetime, json, os
          e = os.environ
          print(json.dumps({
              "repository": e["REPO"],
              "input_ref": e["REA_REF"],
              "resolved_sha": e["REA_SHA"] or "unobserved",
              "package_version": e["REA_VERSION"],
              "install_method": "npm-registry-package-bound-to-resolved-sha-by-slsa-provenance",
              "install_command": e["REA_INSTALL"],
              "npm_git_head": e["REA_GITHEAD"] or "unobserved",
              "npm_dist_integrity": e["REA_INTEGRITY"] or "unobserved",
              "npm_provenance_git_commit": e["REA_PROVCOMMIT"] or "unobserved",
              "cli_entrypoint": "rea (node_modules/.bin/rea, via rea-env.sh shim)",
              "mcp_entrypoint": "rea mcp (via rea-env.sh)",
              "install_failure_reason": e["REA_REASON"] or None,
              "date_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, indent=2))
          PY

      - name: Build fixtures and record toolchain
        run: |
          set -u
          first() { "$@" 2>&1 | head -n 1; }
          NC_RC=0; NC=$(sh docs/spikes/796/fixtures/native-codec/build.sh 2>"$RUNNER_TEMP/nc.err") || NC_RC=$?
          PA_RC=0; PA=$(sh docs/spikes/796/fixtures/packaged-app/build.sh 2>"$RUNNER_TEMP/pa.err") || PA_RC=$?
          [ "$NC_RC" -eq 0 ] || echo "infra_failed=1" >> "$GITHUB_ENV"
          [ "$PA_RC" -eq 0 ] || echo "infra_failed=1" >> "$GITHUB_ENV"
          NC="$NC" NC_RC="$NC_RC" PA="$PA" PA_RC="$PA_RC" \
          CC_V="$(first cc --version)" MAKE_V="$(first make --version)" STRIP_V="$(first strip --version)" \
          JAVAC_V="$(first javac -version)" JAR_V="$(first jar --version)" UNAME="$(uname -a)" \
            python3 -I - <<'PY' > "$BUNDLE/fixtures.json"
          import json, os
          e = os.environ
          print(json.dumps({
              "fixtures": [
                  {"name": "native-codec", "kind": "elf", "sha256": e["NC"], "build_rc": int(e["NC_RC"])},
                  {"name": "packaged-app", "kind": "jar-jvm-fallback", "sha256": e["PA"], "build_rc": int(e["PA_RC"])},
              ],
              "toolchain": {
                  "cc": e["CC_V"], "make": e["MAKE_V"], "strip": e["STRIP_V"],
                  "javac": e["JAVAC_V"], "jar": e["JAR_V"], "uname": e["UNAME"],
              },
          }, indent=2))
          PY

      - name: Record run metadata
        env:
          MODEL: ${{ inputs.model }}
        run: |
          set -u
          INV=unobserved
          F=$(find _gitops -name cwft-mctl-agents-investigate.yaml 2>/dev/null | head -n 1)
          if [ -n "$F" ]; then
            V=$(grep -E 'ISSUE_INVESTIGATOR_MODEL' -A1 "$F" | grep -oE 'claude-[A-Za-z0-9._-]+' | head -n 1)
            [ -n "$V" ] && INV="$V"
          fi
          SDK=$(uv run --locked python -c "import importlib.metadata as m; print(m.version('claude-agent-sdk'))")
          MCPV=$(uv run --locked python -c "import importlib.metadata as m; print(m.version('mcp'))")
          CLI=$(uv run --locked python -c "import claude_agent_sdk, pathlib, subprocess, sys; b=pathlib.Path(claude_agent_sdk.__file__).parent/'_bundled'/'claude'; print(subprocess.run([str(b),'--version'],capture_output=True,text=True).stdout.strip() if b.exists() else 'unobserved')" 2>/dev/null || echo unobserved)
          INV="$INV" SDK="$SDK" MCPV="$MCPV" CLI="$CLI" PYV="$(uv run --locked python -V)" \
          RUN_ID="$GITHUB_RUN_ID" GIT_SHA="$GITHUB_SHA" RUNNER_OS_NAME="$RUNNER_OS" \
            python3 -I - <<'PY' > "$BUNDLE/run-metadata.json"
          import json, os
          e = os.environ
          print(json.dumps({
              "model_input": e["MODEL"],
              "investigator_model": e["INV"],
              "model_matches_investigator": e["INV"] != "unobserved" and e["INV"] == e["MODEL"],
              "claude_agent_sdk": e["SDK"], "claude_cli": e["CLI"], "mcp": e["MCPV"],
              "python": e["PYV"], "runner_os": e["RUNNER_OS_NAME"],
              "run_id": e["RUN_ID"], "git_sha": e["GIT_SHA"],
          }, indent=2))
          PY

      - name: Measure (single attempt per cell, no retries)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          PROBE_ARM: ${{ inputs.probe_arm }}
        run: |
          set -u
          export ISSUE_INVESTIGATOR_MODEL="$MODEL"
          MCPCMD="sh $GITHUB_WORKSPACE/docs/spikes/796/rea-env.sh $RUNNER_TEMP/rea-prefix/node_modules/.bin/rea mcp"
          FXROOT="$RUNNER_TEMP/runtime-fixtures"
          : > "$BUNDLE/records.jsonl"

          infra() { # step fixture arm rc reason errfile
            STEP="$1" FX="$2" ARM="$3" RC="$4" REASON="$5" ERRF="$6" uv run --locked python - >> "$BUNDLE/records.jsonl" <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from tools.rea_spike import bounded_summary
          e = os.environ
          text = open(e["ERRF"], errors="replace").read() if e["ERRF"] else ""
          print(json.dumps({"kind": "infra-failure", "step": e["STEP"], "fixture": e["FX"],
                            "arm": e["ARM"], "rc": int(e["RC"]), "reason": e["REASON"],
                            "stderr": bounded_summary(text)}))
          PY
            echo "infra_failed=1" >> "$GITHUB_ENV"
            echo "::warning::infra failure: step=$1 fixture=$2 arm=$3 rc=$4 reason=$5"
          }

          invoke() { # step fixture arm dest maxrc harness-args...
            local step=$1 fx=$2 arm=$3 dest=$4 maxrc=$5; shift 5
            local out err rc
            out=$(mktemp); err=$(mktemp)
            local rpath="$PATH"
            [ "$arm" = rea-cli ] && rpath="$RUNNER_TEMP/rea-bin:$PATH"
            local mcp=""
            if [ "$arm" = rea-mcp ] || [ "$step" = schema-bytes ]; then mcp="$MCPCMD"; fi
            rc=0; REA_SPIKE_MCP_CMD="$mcp" PATH="$rpath" uv run --locked python tools/rea_spike.py "$@" >"$out" 2>"$err" || rc=$?
            if [ "$rc" -le "$maxrc" ] && [ "$(wc -l <"$out")" -eq 1 ] \
               && python3 -I -c 'import json,sys; assert isinstance(json.loads(open(sys.argv[1]).read()), dict)' "$out" 2>/dev/null; then
              cat "$out" >> "$BUNDLE/$dest"
            else
              infra "$step" "$fx" "$arm" "$rc" "harness-failure" "$err"
            fi
            rm -f "$out" "$err"
          }

          staged=""
          for fx in native-codec packaged-app; do
            serr=$(mktemp); src=0
            uv run --locked python tools/rea_spike.py stage-fixtures "$FXROOT" --fixture "$fx" >/dev/null 2>"$serr" || src=$?
            if [ "$src" -eq 0 ]; then
              staged="$staged $fx"
            else
              infra stage-fixtures "$fx" "" "$src" "fixture-stage-failed" "$serr"
            fi
            rm -f "$serr"
          done

          # Remove the answer key, fixture sources and git history from the
          # workspace before any model call; scoring runs offline elsewhere.
          rm -rf "$GITHUB_WORKSPACE/docs/spikes/796/fixtures" "$GITHUB_WORKSPACE/.git"

          # schema-bytes (REA-dependent)
          if [ "$rea_ok" = true ]; then
            invoke schema-bytes "" "" schema-bytes.json 0 schema-bytes --allow-live
          else
            infra schema-bytes "" "" 0 rea-unavailable ""
          fi

          for fx in native-codec packaged-app; do
            case " $staged " in *" $fx "*) ;; *) continue ;; esac
            for arm in baseline rea-mcp rea-cli; do
              if [ "$arm" != baseline ] && [ "$rea_ok" != true ]; then
                infra run "$fx" "$arm" 0 rea-unavailable ""
                continue
              fi
              invoke run "$fx" "$arm" records.jsonl 1 run --allow-live --fixture "$fx" --fixture-root "$FXROOT" --arm "$arm" --model "$MODEL"
            done
          done

          for fx in native-codec packaged-app; do
            case " $staged " in *" $fx "*) ;; *) continue ;; esac
            if [ "$PROBE_ARM" != baseline ] && [ "$rea_ok" != true ]; then
              infra probe-stages "$fx" "$PROBE_ARM" 0 rea-unavailable ""
              continue
            fi
            invoke probe-stages "$fx" "$PROBE_ARM" records.jsonl 0 probe-stages --allow-live --fixture "$fx" --fixture-root "$FXROOT" --arm "$PROBE_ARM" --model "$MODEL"
          done

      - name: Report and grading template
        if: always()
        run: |
          set -u
          [ -f "$BUNDLE/records.jsonl" ] || : > "$BUNDLE/records.jsonl"
          uv run --locked python tools/rea_spike.py report "$BUNDLE/records.jsonl" > "$BUNDLE/report.md" || echo "infra_failed=1" >> "$GITHUB_ENV"
          python3 -I - > "$BUNDLE/grading-template.yaml" <<'PY'
          print("entries:")
          for fx in ("native-codec", "packaged-app"):
              for arm in ("baseline", "rea-mcp", "rea-cli"):
                  print(f"  - fixture: {fx}")
                  print(f"    arm: {arm}")
                  print("    claims: []")
                  print("    actionable: unobserved")
                  print('    grader: ""')
          PY
          cat "$BUNDLE/report.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Bundle guard
        if: always()
        env:
          GUARD_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GUARD_GH: ${{ github.token }}
        run: |
          set -u
          bad=0
          for v in "$GUARD_OAUTH" "$GUARD_GH"; do
            [ -n "$v" ] || continue
            if grep -rqF -e "$v" "$BUNDLE"; then bad=1; fi
          done
          while IFS= read -r f; do
            cap=262144
            [ "$(basename "$f")" = records.jsonl ] && cap=2097152
            [ "$(wc -c <"$f")" -le "$cap" ] || bad=1
          done < <(find "$BUNDLE" -type f)
          if [ "$bad" -ne 0 ]; then
            rm -rf "$BUNDLE"; mkdir -p "$BUNDLE"
            echo '{"withheld": true}' > "$BUNDLE/WITHHELD.json"
            echo "::error::bundle guard tripped (secret or oversized file); bundle withheld"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rea-spike-796-${{ github.run_id }}
          path: ${{ runner.temp }}/rea-spike-796/
          retention-days: 14
          if-no-files-found: error

      - name: Final gate
        if: always()
        run: |
          if [ "${infra_failed:-0}" = 1 ] || [ "${rea_ok:-false}" != true ]; then
            echo "::error::infrastructure failure (rea_ok=${rea_ok:-?}, infra_failed=${infra_failed:-?}); affected cells are infra-failure records, not REA or model results"
            exit 1
          fi

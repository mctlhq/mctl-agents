name: Claude PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    uses: mctlhq/.github/.github/workflows/claude-review.yml@aca5e626d3066bde2b408697b8667ed6bf4eb51d
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      # dependabot is listed so its PRs get reviewed automatically.
      # Without it claude-code-action hard-fails with "Workflow initiated
      # by non-human actor", and since branch protection requires an
      # approving review, dependabot PRs then sit unmergeable until a
      # maintainer triggers a review by hand.
      #
      # mctl-agents is the App whose token release-please now runs under
      # (release-please.yml, AGENTS_APP_ID). It is the *actor* of the run,
      # which is what claude-code-action checks — distinct from the PR
      # author. Its absence is what failed the review on release PR #141
      # with the same "non-human actor" error (mctlhq/mctl-gitops#819).
      allowed-bots: "github-actions,mctl-app,mctl-agents,dependabot"
      conventions: |
        Follow the conventions in this repository's CLAUDE.md (Python style,
        conventional commits, English only, no emoji).

        Focus on:
        - Correctness and logic errors; edge cases the change misses.
        - Security: injection, authentication/authorization, secret
          handling, unsafe input.
        - Error handling: ignored errors, missing context.
        - Test coverage: behaviour changed without a corresponding test.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}

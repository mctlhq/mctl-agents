name: PR validation

# The test suite has existed for a long time but ran on no PR, so a change
# could break all of it and still merge green. This workflow is the gate.
#
# Note that adding the workflow is only half of it: until the `tests` job is
# a required status check on `main`, a PR can still be merged without it.
# That is a repository setting, not a file — see the PR description.
#
# Before making it required, mind release-please: it opens its release PR with
# the default GITHUB_TOKEN, and GitHub suppresses workflow triggers for events
# raised by that token (anti-recursion). Release PRs therefore never run this
# workflow and can never satisfy a required `tests` check. Today they are
# merged manually with `gh pr merge --admin`, which bypasses required checks,
# so releases keep working — but the release commit goes unvalidated. The real
# fix is to hand release-please-action a GitHub App token so its PRs trigger
# workflows normally; that belongs in a change to release-please.yml, not here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Pull requests share a group per ref, so a superseded push cancels the run
  # it replaced. Pushes to main get one group per commit instead.
  #
  # The per-commit group matters: GitHub keeps at most one running and one
  # pending run per group, and a newly queued run evicts the pending one even
  # when cancel-in-progress is false. With a shared group, three merges
  # landing in quick succession would silently drop the middle commit's
  # validation — the opposite of what a per-commit record is for.
  group: pr-validation-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-lint:
    name: commit-lint
    # release-please parses every individual commit on main (not the PR title,
    # not the merge commit) and silently skips ones it can't tag as feat/fix —
    # if NONE of a PR's commits use a releasable type, the whole PR's work
    # ships with no version bump, no CHANGELOG entry, no image ever built for
    # it, and no error anywhere (regression: PR #106 merged 2026-08-05 with
    # commits "phase5: ..." / "address review: ...", release-please logged
    # "No user facing commits found - skipping" and moved on). This job makes
    # that silent gap loud instead: it fails the PR (not main; this workflow's
    # own push:main trigger will still validate the merge, but by then it's
    # too late to fix commit messages) if not one commit qualifies.
    #
    # Same caveat as `tests` below (see the file-level comment at the top):
    # this only fails the PR *check* — it doesn't gate a merge until it's a
    # required status check, and release-please's own admin-merge path
    # bypasses required checks entirely either way.
    runs-on: ubuntu-latest
    # Skipped on release-please's own branches. A release PR carries exactly
    # one commit, `chore(main): release x.y.z`, which by design is not a
    # releasable type — the release it cuts is the PR, not a change awaiting
    # one. Running this check there fails a PR that is already correct, and
    # that red check is what forced `--admin` merges (mctlhq/mctl-gitops#819).
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--branches--')
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: At least one commit must be a releasable Conventional Commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A PR that ships nothing has nothing to release, and this check
          # firing there is not a caught mistake — it is a standing
          # invitation to retype an honest `test:`/`ci:`/`docs:` commit as
          # `fix:` purely to clear the check, which cuts a release whose
          # CHANGELOG entry describes production work that release does not
          # contain. That is strictly worse than the silent no-release this
          # job exists to prevent: a wrong entry misleads, a missing one is
          # merely absent. First hit: #243, a tests-only regression PR for
          # the #231 concurrency fix.
          #
          # Deliberately a tight allowlist rather than "no source files
          # changed". tests/, docs/ and .github/ are the three trees that
          # reach neither the built image nor the published package, so
          # nothing under them can ship unreleased. Anything outside them
          # still has to justify itself with a releasable commit — including
          # config/ and entrypoint.sh, which do ship. .github/ has to be in
          # the list for this very change to pass its own check, which is
          # the same reasoning, not an exception to it.
          # Three dots, not two, and not the same shape as the `git log`
          # range below. `pull_request.base.sha` is the tip of the target
          # branch at event time, so it ADVANCES while a PR sits open: a
          # two-point `git diff base head` compares the two trees and
          # therefore reports every file main changed since the branch
          # forked, as though this PR had touched it. A tests-only PR would
          # then be told to add a `fix:` commit purely because someone else
          # merged production code — failing on rebase state rather than on
          # its own content. `base...head` diffs from the merge base, which
          # is exactly the set of paths this PR is responsible for.
          # (`git log base..head` below stays two-dot: for COMMITS that
          # already means "reachable from head but not base", which is the
          # right set. Same-looking syntax, different semantics.)
          # core.quotePath=false because git escapes non-ASCII paths by
          # default — `tests/данные.json` comes back as
          # "tests/\320\264..." , leading double-quote included, which the
          # anchored allowlist below cannot match. A tests-only PR would
          # then be read as shipping. (Spaces alone are NOT quoted; the
          # trigger is non-ASCII, verified rather than assumed.)
          # --no-renames because rename detection collapses a move into the
          # DESTINATION path alone: `git mv orchestrator/x.py tests/x.py`
          # reports just `tests/x.py`, the allowlist sees a tests-only PR,
          # and the check waves through a change that deletes a file the
          # image ships. Classifying both endpoints is the whole job here,
          # so the detection that normally helps a reader hurts.
          if ! FILES=$(git -c core.quotePath=false diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}"); then
            echo "::error::git diff failed for range ${BASE_SHA}...${HEAD_SHA} — cannot check changed paths."
            exit 1
          fi
          # An empty diff is not "all paths are allowlisted" — grep -qv finds
          # no non-matching line on empty input either, so the check below
          # would pass it for the wrong reason. Say so explicitly instead.
          if [ -z "$FILES" ]; then
            echo "This PR changes no files — nothing to release."
            exit 0
          fi
          # `grep -qv` succeeds when at least ONE path falls outside the
          # allowlist, i.e. the PR does ship something. Inverted here: no
          # such path means nothing ships. Here-string for the same reason
          # as the SUBJECTS check below.
          SHIPPING_PATHS='^(tests/|docs/|\.github/)'
          if ! grep -qvE "$SHIPPING_PATHS" <<< "$FILES"; then
            echo "Every changed path is under tests/, docs/ or .github/ — this PR ships nothing:"
            sed 's/^/  · /' <<< "$FILES"
            echo "Skipping the releasable-commit requirement."
            exit 0
          fi
          # Same type set release-please's default config treats as
          # releasable (bumps minor/patch, gets a CHANGELOG entry): feat/fix,
          # plus perf and revert which it also bumps by default.
          # Trailing space is load-bearing: Conventional Commits requires it
          # after the colon, and release-please's parser will not read
          # `fix:typo` as a commit at all — it would skip exactly the commit
          # this check just certified as releasable, which is the silent
          # no-release this job exists to catch. `!` stays optional so
          # `fix!: x` and `fix(scope)!: x` still match.
          PATTERN='^(feat|fix|perf|revert)(\([^)]+\))?!?: '
          # Capture git log's own exit status explicitly rather than via a
          # process substitution feeding the loop below — under `set -e` a
          # failure inside `< <(...)` is not propagated to the script, so an
          # invalid/unreachable SHA range would silently look identical to
          # "no releasable commits found" and report the wrong error.
          if ! SUBJECTS=$(git log --format=%s "${BASE_SHA}..${HEAD_SHA}"); then
            echo "::error::git log failed for range ${BASE_SHA}..${HEAD_SHA} — cannot check commit messages."
            exit 1
          fi
          # Here-string, not a heredoc: a heredoc's terminator has to sit at
          # column 0, which would break out of this YAML block scalar's
          # indentation and make the whole workflow file invalid. Not a pipe
          # into grep either — under `pipefail`, grep -q exiting early can
          # SIGPIPE the writer and turn a *successful match* into a non-zero
          # pipeline status, i.e. the exact opposite verdict.
          if grep -qE "$PATTERN" <<< "$SUBJECTS"; then
            grep -E "$PATTERN" <<< "$SUBJECTS" | sed 's/^/✓ releasable commit: /'
          else
            echo "::error::No commit in this PR uses a release-please-releasable type (feat/fix/perf/revert)." \
                 "release-please will merge this PR's changes into main but silently cut NO release for it —" \
                 "no version bump, no CHANGELOG entry, no image build. Prefix at least one commit" \
                 "(e.g. 'fix: ...' or 'feat: ...') describing the user-facing change."
            exit 1
          fi

  tests:
    name: tests
    runs-on: ubuntu-latest
    # The suite finishes in seconds, so anything approaching this is hung.
    # Without a cap, a wedged run would sit on a runner until GitHub's 6-hour
    # default and hold the concurrency group the whole time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          # Pinned for the same reason the dependencies are: the installer is
          # part of what makes a build reproducible. Keep in step with the
          # version the Dockerfile copies in.
          version: "0.11.11"
          # Keep in sync with the Dockerfile base image (python:3.12-slim),
          # pyproject's requires-python, and — later — ruff's target-version.
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # No --no-dev here, unlike the Dockerfile: CI wants the dev group,
        # which is where pytest lives. --locked (not --frozen) is what
        # actually rejects a stale lockfile: --frozen only fails if uv.lock is
        # missing entirely, and otherwise installs whatever it already pins
        # even if pyproject.toml has since moved — verified empirically by
        # bumping a version bound without re-locking and confirming --frozen
        # exits 0 on the stale lock while --locked exits 1.
        run: uv sync --locked

      # The catalog and clusterWorkflowTemplate checks compare this repo's
      # builders against mctl-gitops. Without the checkout they returned []
      # here — a check reporting success in the one environment that gates
      # the merge, which is how _check_cluster_workflow_template stayed a
      # silent no-op for its whole life (mctl-agents#277).
      #
      # No token: mctl-gitops is public, so the default GITHUB_TOKEN suffices
      # and this also works on dependabot PRs, which get no Actions secrets
      # at all. A gated checkout would have turned every dependabot run red.
      #
      # Checked out INSIDE the workspace because actions/checkout refuses to
      # write outside it, so the sibling layout a developer has is not
      # reproducible here — MCTL_GITOPS_ROOT points the validator at it.
      - name: Check out mctl-gitops for the cross-repo checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mctlhq/mctl-gitops
          path: _gitops
          persist-credentials: false

      - name: Run tests
        env:
          MCTL_GITOPS_ROOT: ${{ github.workspace }}/_gitops/platform-gitops
        run: uv run --locked pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Independent of the tests job (not needs: tests) — ruff and mypy
    # together run in a couple seconds, so there's no cost to running them
    # in parallel, and a separate job keeps "lint failed" and "tests failed"
    # unambiguous from each other rather than one red job meaning either.
    # ruff and mypy stay two steps in one job rather than two jobs: both are
    # static analysis with no runtime cost worth isolating, and splitting
    # them would just double the checkout/setup-uv/sync overhead for two
    # sub-second checks. Step names still make failure attribution clear.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run --locked ruff check orchestrator config tests tools

      - name: Run mypy
        # No target dirs on the CLI: mypy's own [tool.mypy].files in
        # pyproject.toml is the source of truth for what's checked (see that
        # config's comment for why tests/ is out for now), and passing dirs
        # here would silently override it instead of extending it.
        run: uv run --locked mypy

  docker-build:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    # Runs after the tests rather than beside them: the image installs the
    # gh CLI and a large SDK wheel, so it is far slower than the suite.
    # Gating it on the tests keeps fast feedback fast and skips a costly
    # build when the suite is already red. Not gated on lint — a lint
    # failure doesn't mean the image is broken, so there's no reason to
    # skip the build smoke-check because of it.
    needs: tests
    # Higher than the test job: this one pulls apt packages and a large SDK
    # wheel. Still far below GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (smoke, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mctl-agents:pr-${{ github.event.pull_request.number || github.sha }}

      # The build alone proves nothing about whether the image RUNS. On
      # 2026-08-28 release 1.29.2 shipped green from this very job: a
      # dependabot bump to python:3.14-slim, against a pyproject pinned to
      # ">=3.12,<3.13", left `uv sync --locked` succeeding while installing
      # the project deps into a venv with no interpreter on PATH. Every agent
      # run then died on `import anyio`, the pipeline was down 7 hours, and
      # CI had said nothing. Importing each entrypoint the CWFTs actually
      # invoke catches that entire class — image builds, image cannot start.
      #
      # Import only, no execution: none of these modules do I/O or need
      # credentials at import time (verified against the published 1.29.3
      # image), so this needs no secrets and stays fast.
      - name: Image must import every entrypoint
        env:
          IMAGE: mctl-agents:pr-${{ github.event.pull_request.number || github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c '
          import importlib, sys, traceback
          mods = [
              "run_all", "run_implementer", "run_incident_responder",
              "run_issue_investigator", "run_issue_poller", "run_mentor",
              "run_service_agent", "run_shepherd",
              # Not a run_* module: the Temporal worker is its own deployed
              # service (mctl-agents-worker) with its own dependency surface —
              # a broken activity/workflow import there ships a CrashLoop that
              # none of the nine CWFT entrypoints would have caught.
              "temporal.worker",
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module("orchestrator." + m)
              # BaseException, not Exception: a module calling sys.exit() at
              # import time raises SystemExit, which Exception does not catch
              # — the interpreter would exit 0 and the step would pass while
              # silently skipping every remaining entrypoint.
              except BaseException:
                  failed.append(f"orchestrator.{m}:\n{traceback.format_exc()}")
          # Full traceback, not just the exception type: an import that dies
          # deep in a dependency says nothing useful from its top frame, and
          # rebuilding the image locally to find out is the slowest possible
          # way to read a stack trace.
          for f in failed:
              print(f, file=sys.stderr)
          print(f"imported {len(mods) - len(failed)}/{len(mods)} entrypoints")
          sys.exit(1 if failed else 0)
          '

      - name: Image must not run as root
        env:
          IMAGE: mctl-agents:pr-${{ github.event.pull_request.number || github.sha }}
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          user=$(docker run --rm --entrypoint id "$IMAGE" -un)
          echo "runtime uid=$uid user=$user"
          test "$uid" = "1000"
          test "$user" = "app"

name: Build & push Docker image

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+']  # semver, no v prefix per project convention
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO=ghcr.io/${{ github.repository }}
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tags=${REPO}:${{ github.ref_name }},${REPO}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REPO}:main-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-gitops:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch gitops image bump
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh workflow run gitops-bump.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f image_name=ghcr.io/mctlhq/mctl-agents \
            -f image_tag="$TAG" \
            -f values_glob="platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml"

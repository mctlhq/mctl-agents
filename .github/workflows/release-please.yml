name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Mint the OIDC token the agent-registry refresh exchanges at Vault for
  # a short-lived, read-only credential. No long-lived secret exists for
  # this — see the "Refresh agent registry" step.
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # mctlhq/mctl-agents#565. The investigate CWFT resolves issue-investigator
  # declaratively (mctl-gitops#1585): every run re-hashes agent.yaml inside
  # the image and fails closed when that differs from the gitops binding's
  # spec.sourceManifest.contentHash. A release is what puts a new agent.yaml
  # in front of production, along TWO paths, both driven by the
  # release-please job below:
  #   - "Dispatch centralized release-deploy" builds the image and bumps
  #     agent_image in every cwft-mctl-agents-*.yaml, so any submission that
  #     does not pin an image runs the new one as soon as Argo CD syncs;
  #   - "Refresh agent registry" publishes and promotes issue-investigator,
  #     which is the image_ref DevLoopWorkflow pins per run.
  # So the gate runs BEFORE release-please, not before one of those steps:
  # failing there stops the tag, the image, the CWFT bump and the promotion
  # together, and production stays on the previous, matching release.
  #
  # mctlhq/mctl-agents#582: the gate covers every agent, not only
  # issue-investigator. "Refresh agent registry" promotes an agent only when
  # its binding matches (#470), but it decides that after the tag exists, in
  # a step a re-run skips. The gate asks the same question
  # (check_binding_hash.evaluate_promotion) for every manifest at the release
  # commit first, so a stale or absent binding for any agent stops the
  # release here, while it is still a plain re-run away from recovery.
  #
  # Gating here also keeps recovery a plain re-run. release-please cuts a
  # release for a merged PR still labelled "autorelease: pending" and only
  # relabels it once the release exists, so a run stopped by this gate leaves
  # the label in place; after the binding is re-pinned, re-running the
  # workflow cuts the release normally. A gate placed after release creation
  # would leave a tag with no image, and a re-run would find nothing pending.
  binding-gate:
    name: binding gate
    runs-on: ubuntu-latest
    # Sized for one release commit in the degraded case: 16 sequential reads
    # (two for the resolver check, two per manifest), each waiting out a 429's
    # Retry-After (up to 60s) before both of its retries, is 32 min. See the
    # binding-hash job in pr-validation.yml; the same test pins both.
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only a run that will cut a release needs the gate; on every other
      # push to main release-please only edits its release PR. An empty,
      # successful listing is GitHub's documented "none pending". A failed
      # listing is not that: it falls through to gating the head commit,
      # because a release we could not rule out is one we must check.
      - name: Find the commit a release would be cut from
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if SHAS=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                      --label "autorelease: pending" \
                      --json mergeCommit --jq '.[].mergeCommit.oid | select(. != null)'); then
            if [ -z "$SHAS" ]; then
              echo "No merged release PR is pending: this run cuts no release, nothing to gate."
              echo "shas=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "::warning::Could not list pending release PRs; gating ${GITHUB_SHA} instead of skipping."
            SHAS="$GITHUB_SHA"
          fi
          # One line: a multi-line value would need the heredoc output form.
          echo "shas=$(tr '\n' ' ' <<< "$SHAS")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.pending.outputs.shas != '' }}
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: ${{ steps.pending.outputs.shas != '' }}
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: true

      # Checked at the release PR's merge commit, which is the commit
      # release-please tags and therefore the agent.yaml the image ships —
      # not merely whatever main's head happens to be. Only the manifests
      # come from that commit; the gate itself, the resolver and the lockfile
      # stay at this run's head. A pending release commit that predates the
      # gate (or a later move of the script) would otherwise fail on a
      # missing file, and no re-pin or re-run could ever clear that.
      #
      # The whole agents/_manifests directory is replaced, not overlaid: the
      # tool lists the agents from disk, so after `rm -rf` and the checkout
      # it sees exactly the release commit's set. A manifest that commit adds
      # is checked (and reported as missing if nobody bound it), and one it
      # no longer has is not.
      #
      # Exit 1: a binding does not match or is missing. Exit 2: a binding or
      # profile could not be read, which is never a match. One line per
      # agent goes to the log and the job summary.
      - name: every agent.yaml must match its gitops binding at the release commit
        if: ${{ steps.pending.outputs.shas != '' }}
        env:
          SHAS: ${{ steps.pending.outputs.shas }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uv sync --locked
          for sha in $SHAS; do
            echo "== release commit $sha"
            if ! git cat-file -e "${sha}:agents/_manifests/issue-investigator/agent.yaml" 2>/dev/null; then
              echo "::error::Release commit $sha has no agents/_manifests/issue-investigator/agent.yaml, so the gate cannot check it." \
                   "If that release should not be cut, remove the 'autorelease: pending' label from its PR; otherwise tag it by hand."
              exit 1
            fi
            rm -rf agents/_manifests
            git checkout --quiet "$sha" -- agents/_manifests
            uv run --locked python tools/check_agent_bindings.py --label "release commit $sha"
          done

      # A stopped release is otherwise silent: the release-please job's own
      # notification below never runs, because that job never starts.
      - name: Notify Telegram that the binding gate stopped a release
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: secrets are not configured"
            exit 0
          fi

          # printf rather than a heredoc: one line per argument, nothing that
          # depends on how the block scalar's indentation is stripped.
          MESSAGE=$(printf '%s\n' \
            "❌ mctl-agents release stopped by the binding gate" \
            "An agent.yaml does not match its mctl-gitops release binding, a binding is missing, or a binding or its execution profile could not be read (the job summary names the agent). No tag, image or promotion was made." \
            "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true

  release-please:
    needs: binding-gate
    runs-on: ubuntu-latest
    steps:
      # Uses mctl-agents, the backend-only automation App — deliberately NOT
      # MCTL App (secrets.APP_ID), which this used to read. MCTL App is the
      # App customers install themselves from mctl.ai/#request-access, and it
      # is being narrowed to contents:read + metadata:read so its published
      # least-privilege description is actually true (mctlhq/mctl-gitops#761).
      # A GitHub App's permissions apply to every installation alike, so this
      # was the single loudest contradiction: release-please here asks for
      # contents/pull-requests/issues write, which meant customers were asked
      # for the same three on their own repositories.
      - name: Generate release-please App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-agents
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Uses mctl-agents, the backend-only automation App — deliberately
      # NOT MCTL App (secrets.APP_ID). MCTL App is the App customers install
      # themselves from mctl.ai/#request-access, and it is being narrowed to
      # contents:read + metadata:read so its published least-privilege
      # description is actually true (mctlhq/mctl-gitops#761). A GitHub App's
      # permissions apply to every installation alike, so anything needing
      # write — like actions:write on mctl-gitops to dispatch below — has to
      # live on the internal App instead.
      - name: Generate Platform App token
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENTS_APP_ID }}
          private-key: ${{ secrets.AGENTS_APP_PRIVATE_KEY }}
          owner: mctlhq
          repositories: mctl-gitops

      # All three worker deployments are named, not just the control one.
      # The queue split (ADR-008, D7) runs three Deployments off this one image, and
      # values_path names exactly the files to bump: a worker nobody names
      # is bumped by nobody and pins to whatever tag it launched with.
      # That is not a hypothetical — it is what left the shepherd on
      # 1.25.0 for three weeks (#220, fixed in #238), and ADR-008 calls it
      # the most likely way that ADR goes wrong.
      #
      # release-deploy requires EVERY named path to match an image pattern
      # (mctl-gitops#962) and errors otherwise, so a rename or a deleted
      # deployment fails the release loudly instead of quietly skipping a
      # worker. If this dispatch ever starts failing with "no image tag
      # pattern for ... in explicitly requested ...", that is the guard
      # working: fix the list, do not drop the path.
      - name: Dispatch centralized release-deploy
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh workflow run release-deploy.yaml \
            --repo mctlhq/mctl-gitops \
            --ref main \
            -f repo=mctlhq/mctl-agents \
            -f git_ref="$TAG" \
            -f image_name=ghcr.io/mctlhq/mctl-agents \
            -f image_tag="$TAG" \
            -f team_name=admins \
            -f component_name=mctl-agents \
            -f values_glob="platform-gitops/argo-workflows/cluster-templates/cwft-mctl-agents-*.yaml" \
            -f values_path="platform-gitops/services/admins/mctl-agents-worker/values.yaml,platform-gitops/services/admins/mctl-agents-worker-exec/values.yaml,platform-gitops/services/admins/mctl-agents-worker-implement/values.yaml"

      # Refresh the agent registry so DevLoopWorkflow resolves THIS release
      # rather than whatever was published last by hand. Nothing did this
      # before, and the pins drifted: shepherd sat on 1.25.0 from
      # 2026-08-07 while the repo released 1.33.0 — and once the in-loop
      # shepherd tick started pinning the released image, that stale row
      # became the image those ticks would run.
      #
      # The mctl-api token comes from Vault via GitHub OIDC, not from an
      # Actions secret: a repo secret is readable by every workflow on the
      # repo, whereas the Vault role `mctl-agents-release` is bound to
      # this repository AND this workflow file, mints a 10-minute token,
      # and its policy can read exactly one KV path. Same pattern as
      # mctl-gitops' build-image.yaml.
      # Only when a release was actually cut, and only after it was: the
      # job otherwise has no repository on disk at all (release-please
      # itself works entirely through the API). fetch-depth: 0 because the
      # publish tool reads files out of the new tag's tree via `git show`,
      # and a shallow clone has neither the tag nor the objects behind it.
      - name: Check out the released commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}
          fetch-depth: 0

      # Own interpreter rather than the image's system python: a system-wide
      # `pip install` on a PEP 668 image ("externally managed environment")
      # fails outright, and this step is the release pipeline — it must not
      # depend on whether the runner image happens to ship that marker, or
      # on `python` being symlinked to `python3` (agy P1).
      #
      # uv and the lockfile rather than `pip install httpx pyyaml`: since
      # #470 the publish tool gates every production promotion on the
      # mctl-gitops binding through orchestrator.resolver, which imports the
      # project's config package and its dependencies. Same pins as the
      # binding-gate job, so both gates run against the same resolver.
      - name: Set up uv
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: true

      # Publishes every agent in the tag, but PROMOTES to production only
      # the agents whose mctl-gitops release binding pins this tag's exact
      # agent.yaml (mctlhq/mctl-agents#470). A missing, stale or unreadable
      # binding refuses that agent's promotion and fails this step, after
      # every other agent has been published and promoted on its own; the
      # per-agent outcome lands in the log and the job summary. The one
      # quiet refusal is a missing binding for an agent listed in the
      # tool's UNBOUND_AGENTS, which is empty since mctl-gitops#1683.
      #
      # The binding-gate job already asked this for every agent before the
      # tag (#582), so a refusal here means mctl-gitops changed, or stopped
      # answering, between that job and this step. It is still the check
      # that decides the promotion; the gate only makes it unsurprising.
      - name: Refresh agent registry
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          VAULT_ADDR: https://secrets.mctl.ai
          TAG: ${{ steps.release.outputs.tag_name }}
          # Read-only use: lifts the anonymous rate limit on the mctl-gitops
          # binding reads. This job's default token, not an App token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JWT=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/mctlhq" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')

          # Fail loudly rather than fall open: build-image.yaml silently
          # skipped its Vault step for months because the login failed and
          # nothing said so (see the F9 incident, 2026-08-15).
          VAULT_TOKEN=$(curl -sf -X POST "$VAULT_ADDR/v1/auth/jwt/login" \
            -d "{\"role\":\"mctl-agents-release\",\"jwt\":\"$JWT\"}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["auth"]["client_token"])')

          # The registry-publisher token, not the admin service token the
          # agent pods run with (#470): mctl-api confines this principal to
          # the three publication routes this tool calls, and it lives on a
          # Vault path the agent pods never extract. So an agent cannot
          # publish or promote a definition with its own credentials.
          MCTL_TOKEN=$(curl -sf -H "X-Vault-Token: $VAULT_TOKEN" \
            "$VAULT_ADDR/v1/secret/data/platform/mctl-api/registry-publisher" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"]["data"]["token"])')
          echo "::add-mask::$MCTL_TOKEN"

          uv sync --locked --quiet
          MCTL_TOKEN="$MCTL_TOKEN" uv run --locked python tools/publish_agent_release.py "$TAG"

      - name: Notify Telegram on release/deploy failure
        if: ${{ failure() && steps.release.outputs.release_created == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram notification skipped: secrets are not configured"
            exit 0
          fi

          MESSAGE=$(cat <<EOF
          ❌ mctl-agents release step failed
          Tag ${TAG} was created, but the deploy dispatch, the registry publish, or the per-agent promotion gate failed (see the job summary for which agents were refused).
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )

          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true

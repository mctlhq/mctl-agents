name: spike-707 pyrefly bench (experimental)
# Measurement-only workflow for the #707 spike. Gates nothing, uses no
# secrets, and is deleted when the spike closes. Every timed number in
# docs/spikes/707-pyrefly-type-check.md comes from one run of this job on a
# GitHub-hosted ubuntu-latest runner.
on:
  pull_request:
    paths:
      - "docs/spikes/707/**"
      - ".github/workflows/spike-707-bench.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spike-707-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth 0: a shallow clone cannot see the pinned baseline SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: false

      - name: Print environment
        run: |
          echo "== cpu"; lscpu | grep -E "Model name|^CPU\(s\)"
          echo "== nproc"; nproc
          echo "== memory"; free -m
          echo "== os"; cat /etc/os-release | head -3; uname -a
          uv --version

      - name: Create pinned baseline worktree
        run: |
          git fetch origin 68f10afcb8a96d7b1c54d5d56819d8e39979c275 || true
          git worktree add --detach "$RUNNER_TEMP/baseline" 68f10afcb8a96d7b1c54d5d56819d8e39979c275
          git -C "$RUNNER_TEMP/baseline" log -1 --format='worktree at %H %cs'
          cd "$RUNNER_TEMP/baseline" && uv sync --locked

      - name: Run benchmark
        run: |
          python docs/spikes/707/bench.py \
            --target "$RUNNER_TEMP/baseline" \
            --out "$RUNNER_TEMP/spike-707-results"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spike-707-results
          path: ${{ runner.temp }}/spike-707-results

# AgentManifest for incident-responder. See issue-investigator/agent.yaml
# for the contract this file follows and orchestrator/validate_manifest.py
# for how it's checked.
apiVersion: agents.mctl.ai/v1alpha1
kind: Agent
metadata:
  name: incident-responder
  owner: mctl-agents
spec:
  runtime:
    type: claude-agent-sdk
    entrypoint: orchestrator.run_incident_responder:run_incident_responder
    optionsBuilder: orchestrator.options:build_incident_responder_options
  prompt:
    sources:
      - inline: orchestrator/run_incident_responder.py:_build_prompt
      - file: agents/_incident-responder/CLAUDE.md
  modelPolicy:
    task: service_agent
    # RESPONDER_MODEL = os.getenv("INCIDENT_RESPONDER_MODEL", SERVICE_AGENT_MODEL)
    # in run_incident_responder.py.
    legacyEnvOverride: INCIDENT_RESPONDER_MODEL
  toolPolicy:
    # No Bash, deliberately. This agent reads alert summaries and service logs,
    # which are chosen by whoever can make a service log a line — with a shell
    # attached, a prompt injection there becomes RCE on the orchestrator. The
    # timestamp it used the shell for is interpolated into the prompt, and the
    # proposal slug is derived by string manipulation instead of hashing.
    # See mctlhq/mctl-agents#183.
    allow:
      - Read
      - Write
      - Glob
      - "mcp__mctl__*"
  execution:
    budgetUsd: 5.00          # INCIDENT_RESPONDER_BUDGET_USD default
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-run

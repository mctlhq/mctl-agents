# AgentManifest for platform-reporter. See issue-investigator/agent.yaml for
# the contract this file follows and orchestrator/validate_manifest.py for
# how it's checked.
apiVersion: agents.mctl.ai/v1alpha1
kind: Agent
metadata:
  name: platform-reporter
  owner: mctl-agents
spec:
  runtime:
    type: claude-agent-sdk
    entrypoint: orchestrator.run_platform_reporter:run_platform_reporter
    optionsBuilder: orchestrator.options:build_platform_reporter_options
  prompt:
    sources:
      - inline: orchestrator/run_platform_reporter.py:build_prompt
      - file: agents/_platform-reporter/CLAUDE.md
  modelPolicy:
    task: platform_report
  toolPolicy:
    # No Bash: the report is assembled from mctl MCP reads plus a markdown
    # write. The current UTC timestamp is interpolated into the prompt.
    # Incident summaries and log lines are untrusted input; a shell would
    # turn a successful injection into RCE on the orchestrator.
    # MCP tools are an explicit read-only allowlist (no mcp__mctl__*
    # wildcard) so the SDK cannot execute deploy/scale/trigger/resolve
    # even if a prompt injection asks it to.
    allow:
      - Read
      - Write
      - Edit
      - Glob
      - Grep
      - mcp__mctl__mctl_whoami
      - mcp__mctl__mctl_list_tenants
      - mcp__mctl__mctl_list_services
      - mcp__mctl__mctl_get_resource_usage
      - mcp__mctl__mctl_get_service_status
      - mcp__mctl__mctl_incident_summary
      - mcp__mctl__mctl_list_incidents
      - mcp__mctl__mctl_list_recent_operations
      - mcp__mctl__mctl_list_recent_agent_runs
      - mcp__mctl__mctl_list_previews
      - mcp__mctl__mctl_get_incident
      - mcp__mctl__mctl_get_service_logs
      - mcp__mctl__mctl_list_workflows
      - mcp__mctl__mctl_get_tenant
  execution:
    budgetUsd: 2.00          # PLATFORM_REPORTER_BUDGET_USD default
    sandbox:
      backend: argo
      clusterWorkflowTemplate: mctl-agents-run

# AgentDefinition for issue-investigator — migrated to agents.mctl.ai/v1alpha2
# as the mctlhq/mctl-agents#227 declarative resolver pilot (see ADR 007,
# docs/adr/007-agent-definition-execution-profile-contract.md, and
# orchestrator/resolver.py). This is the ONE agent migrated by the pilot;
# every other agents/_manifests/*/agent.yaml stays v1alpha1.
#
# The execution shape that used to live inline here (toolPolicy, execution,
# runtime.optionsBuilder/entrypoint) now lives in the referenced
# ExecutionProfile — see tests/fixtures/resolver/profiles/investigator-default.yaml
# for the pilot's compatibility fixture (checked-in, explicitly
# non-promotable; NOT a second production catalog — see that file's header).
#
# orchestrator/manifest.py's v1alpha2 branch still resolves this file's
# executionProfileRef down to the identical toolPolicy/execution/runtime
# shape v1alpha1 exposed, so orchestrator/validate_manifest.py and
# tests/test_manifest.py keep checking the exact same claims (entrypoint
# resolves, allowed_tools/budget match orchestrator/options.py, modelPolicy
# task is real) they always have — just sourced from the profile instead of
# this file.
apiVersion: agents.mctl.ai/v1alpha2
kind: AgentDefinition
metadata:
  name: issue-investigator
  owner: mctl-agents
spec:
  prompt:
    sources:
      - inline: orchestrator/run_issue_investigator.py:_build_prompt
  # Real prompt surface also includes the target repo's own CLAUDE.md
  # (setting_sources=["project"] + an explicit instruction to read it) and
  # its source tree. Both live outside this repo, change independently of
  # it, and cannot be hashed at publish time — see
  # docs/agent-inventory.yaml's runtimeContextInputs note for
  # issue-investigator. Recorded here for humans; not machine-checked,
  # because there is nothing in this repo to check it against.
  runtimeContext:
    - targetRepo: CLAUDE.md
    - targetRepo: source tree (Glob/Grep/Read to ground the design)
  triggers:
    - mctl_trigger_issue (MCP, admin-only)
    - orchestrator/run_issue_poller.py (agents:intake label)
  executionProfileRef:
    name: investigator-default
    # Checked against the CONCRETE selected ExecutionProfile version
    # (orchestrator/resolver.py's execute(): the profile fixture's own
    # content hash), never read from a profile-owned range (mctlhq/mctl-agents#227
    # requirements). A profile edit that is not also re-pinned here fails
    # resolution closed instead of silently accepting an incompatible
    # profile version.
    compatibility: "sha256:ea35387723c6837b6aef275617db7cbf52f145f9619c58f6217c7a2c0ccd8f2f"

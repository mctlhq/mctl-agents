# Disposable-cluster only. Mirrors the production split: the main container
# gets no ServiceAccount token, while the Argo executor (init/wait) gets one so
# it can report the step result through workflowtaskresults.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spike881-runner
  namespace: spike881
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spike881-executor
  namespace: spike881
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spike881-executor
  namespace: spike881
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spike881-executor
  namespace: spike881
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spike881-executor
subjects:
  - kind: ServiceAccount
    name: spike881-executor
    namespace: spike881

# Mirrors the implement template's pod posture (securityContext, emptyDir,
# limits, proxy env). runtimeClassName is parameterised: "" means runc.
# ConfigMap fixture-881 holds fixture.tgz (the fixture/ directory, created by the workflow).
# Submit: argo submit -n spike881 fixture-workflow.yaml -p runtime_class=gvisor -p agent_image=<image>
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: fixture-881-
  namespace: spike881
spec:
  entrypoint: fixture
  activeDeadlineSeconds: 1800
  automountServiceAccountToken: false
  arguments:
    parameters:
      - name: agent_image
      - name: runtime_class
        value: ""
  podSpecPatch: |
    runtimeClassName: "{{workflow.parameters.runtime_class}}"
  volumes:
    - name: work
      emptyDir: {}
    - name: fixture
      configMap: {name: fixture-881, defaultMode: 0555}
  templates:
    - name: fixture
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      container:
        image: "{{workflow.parameters.agent_image}}"
        command: [bash, -c, "tar xzf /fixture/fixture.tgz -C /work && bash /work/fixture/run-fixture.sh"]
        env:
          - {name: WORKDIR, value: /work}
          - {name: HTTPS_PROXY, value: "http://squid.spike881.svc:3128"}
          - {name: https_proxy, value: "http://squid.spike881.svc:3128"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
        resources:
          requests: {cpu: 200m, memory: 3Gi, ephemeral-storage: 10Gi}
          limits: {cpu: 3000m, memory: 8Gi, ephemeral-storage: 11Gi}
        volumeMounts:
          - {name: work, mountPath: /work}
          - {name: fixture, mountPath: /fixture}
